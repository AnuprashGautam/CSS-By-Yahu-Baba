<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 5px;

            box-sizing: border-box;
        }
        .search-bar{
            width: 80%;
            padding: 15px;
            margin-inline: auto;

            border: 4px solid grey;
            border-radius: 20px;

            transition: all 1s ease-in-out;

            position: relative;
        }

        .search-bar input{
            width: 100%;
            border: none;
            outline: none;
            font-size: larger;
            background-color: transparent;
        }

       

    

        .search-bar:focus-within{
            width: 100%;
            border-color: tomato;
            box-shadow: 0 0 10px 10px rgb(235, 173, 49) ;
            background-color: grey;
        }

        .search-bar:focus-within::placeholder{
            color: white;
        }
    </style>
</head>
<body>
    <div class="search-bar">
        <input type="text" placeholder="Search...">
    </div>
</body>
</html>
